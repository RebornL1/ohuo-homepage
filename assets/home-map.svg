  <text x="638" y="210" fill="#68707D" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">公开 / 会员 / 私密</text>
  <rect x="608" y="298" width="230" height="122" rx="16" fill="#D55B43"/>
  <text x="638" y="348" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700">关键事件</text>
  <text x="638" y="382" fill="#FFE8E1" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">快速记录 / 时间线</text>
  <rect x="608" y="470" width="230" height="122" rx="16" fill="#FFFFFF" stroke="#D7DED8" stroke-width="2"/>
  <text x="638" y="520" fill="#20242A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700">影视作品</text>
  <text x="638" y="554" fill="#68707D" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">作品 / 引用 / 指导</text>
