<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">个人主页信息结构图</title>
  <desc id="desc">展示学习归档、工具空间、日记、时间线、影视作品和打赏入口之间的连接。</desc>
  <rect width="960" height="720" rx="32" fill="#FDFEFE"/>
  <rect x="72" y="80" width="816" height="560" rx="28" fill="#F4F7F4" stroke="#D7DED8" stroke-width="2"/>
  <rect x="122" y="126" width="260" height="150" rx="16" fill="#236F5A"/>
  <text x="152" y="176" fill="white" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700">学习归档</text>
  <text x="152" y="216" fill="#DDF0E8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">Wiki / 总结 / 思考文章</text>
  <rect x="122" y="310" width="260" height="122" rx="16" fill="#FFFFFF" stroke="#D7DED8" stroke-width="2"/>
  <text x="152" y="360" fill="#20242A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700">小工具空间</text>
  <text x="152" y="394" fill="#68707D" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">持续自用 / 维护状态</text>
  <rect x="122" y="466" width="260" height="122" rx="16" fill="#FFFFFF" stroke="#D7DED8" stroke-width="2"/>
  <text x="152" y="516" fill="#20242A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700">生活日记</text>
  <text x="152" y="550" fill="#68707D" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">日常 / 复盘 / 私密记录</text>
  <circle cx="500" cy="354" r="82" fill="#20242A"/>
  <text x="500" y="344" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700">个人主页</text>
  <text x="500" y="382" text-anchor="middle" fill="#CED7D0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19">可回看的长线</text>
  <rect x="608" y="126" width="230" height="122" rx="16" fill="#FFFFFF" stroke="#D7DED8" stroke-width="2"/>
